# 격리 표적 환경 — 레드/블루 lab 의 실제 표적 (run_lab.py 의 target.py 와 1:1 대응)
#
# 주의: 이 컨테이너들은 의도적으로 취약하다. 반드시 격리된 실습용 호스트에서만,
#       내부 네트워크(internal)와 127.0.0.1 바인딩으로만 띄운다. 외부 노출 금지.
#
# 실행: docker compose up -d   (실습 VM 안에서만)
#       이후 python run_lab.py --live  (라이브 모드는 별도 확장; 기본 데모는 시뮬레이션)

services:
  web-dvwa:
    image: vulfocus/log4j2-cve-2021-44228:latest   # CVE-2021-44228 (Log4Shell)
    ports: ["127.0.0.1:8080:8080"]
    networks: [lab_internal]

  struts-app:
    image: vulhub/struts2:s2-045                    # CVE-2017-5638
    ports: ["127.0.0.1:8081:8080"]
    networks: [lab_internal]

  openssl-svc:
    image: vulhub/openssl:1.0.1f                    # CVE-2014-0160 (Heartbleed)
    ports: ["127.0.0.1:8443:443"]
    networks: [lab_internal]

  spring-app:
    image: vulhub/spring-framework:cve-2022-22965   # CVE-2022-22965 (Spring4Shell)
    ports: ["127.0.0.1:8082:8080"]
    networks: [lab_internal]

  drupal-cms:
    image: vulhub/drupal:8.5.0                       # CVE-2018-7600 (Drupalgeddon2)
    ports: ["127.0.0.1:8083:80"]
    networks: [lab_internal]

networks:
  lab_internal:
    internal: true      # 외부 라우팅 차단 — 격리 보장
